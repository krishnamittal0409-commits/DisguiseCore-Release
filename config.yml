# ==============================================================================
# DisguiseCore - Dynamic Nickname, Rank Disguise & Universal Skin Engine
# Author: Krishna Mittal | All rights reserved.
# Designed for Paper, Purpur, Folia, and Spigot (1.20 - modern versions)
# ==============================================================================

settings:
  # Minimum and maximum character length for custom nicknames
  min-length: 3
  max-length: 16

  # Regex pattern for allowed nickname characters
  # Default: Alphanumeric and underscores only (standard Minecraft usernames)
  allowed-pattern: '^[a-zA-Z0-9_]+$'

  # Update player name in the TAB player list
  update-tab-list: true

  # Format for player display in the tab list
  # Placeholders: {prefix}, {nick}, {suffix}
  tab-format: '{prefix}{nick}{suffix}'

  # Default tab format when un-nicked: {prefix}, {name}, {suffix}
  tab-format-default: '{prefix}{name}{suffix}'

  # When enabled, operators see real player identities directly with staff ranks
  op-direct-visibility: true

  # Update player name in chat
  update-chat: true

  # Chat format when nicked (if no dedicated chat management plugin overrides it)
  chat-format: '{prefix}{nick}{suffix}&f: {message}'

  # Update the overhead nametag above player heads using scoreboard teams
  update-nametag: true

  # Update death messages to show the nickname instead of real name
  update-death-messages: true

  # Automatically restore previous nickname on rejoin
  persist-on-rejoin: true

# LuckPerms Rank & Group Integration
luckperms:
  # Enable LuckPerms rank integration
  enabled: true

  # When enabled, disguises the player's rank prefix to avoid revealing YouTuber / Staff status
  disguise-rank: true

  # The default rank prefix applied to disguised players
  default-disguise-prefix: '&7'

  # The default rank suffix applied to disguised players
  default-disguise-suffix: ''

  # Specific rank-to-rank disguise overrides
  # Example: If a YouTuber has the group 'youtuber', their prefix will disguise as 'default'
  rank-disguises:
    youtuber: 'default'
    media: 'default'
    admin: 'default'
    mod: 'default'
    helper: 'default'

# Authentication & Cracked Server Protection (AuthMe, nLogin, FastLogin)
# Ensures player UUIDs are NEVER modified, preventing inventory loss or auth bypass.
auth-security:
  # Prevent players from choosing a nickname that matches an existing registered user
  prevent-impersonation: true

  # Block nick commands if the player is not authenticated yet in AuthMe
  require-login: true

  # Prevent nicking into existing online or offline players
  block-existing-players: true

# Skin Disguise System
# External Services Notice:
# DisguiseCore uses the public Mojang API (https://api.mojang.com) and Mineskin API (https://api.mineskin.org)
# strictly to fetch skin texture values and cryptographic signatures. No personal data or credentials
# are ever collected or transmitted. Set 'enabled: false' below to disable all external skin requests.
skins:
  # Master toggle for skin fetching and applying
  enabled: true

  # Automatically fetch and apply the skin corresponding to the chosen nickname if it is a real Minecraft account
  # e.g., Running '/nick ClownPierce' will automatically download and apply ClownPierce's official skin!
  auto-fetch-name-skin: true

  # Famous creator & popular skin presets available via the /skins command
  famous-creators:
    - 'ClownPierce'
    - 'Technoblade'
    - 'Dream'
    - 'Camman18'
    - 'ParrotX2'
    - 'Rekrap2'
    - 'WadZee'
    - 'Grian'
    - 'MumboJumbo'
    - 'DanTDM'
    - 'CaptainSparklez'
    - 'IlluminaHD'

  # Mineskin API endpoint for uploading custom skin URLs/files
  mineskin-api-url: 'https://api.mineskin.org/generate/url'

  # Custom skins directory name (inside plugins/DisguiseCore/)
  local-skins-folder: 'skins'

  # Restore original player skin when /unnick is executed
  restore-on-unnick: true

# ==============================================================================
# SkinRestorer Compatibility & Auto-Restore System
# Automatically restores official Mojang skins for cracked / offline servers.
# Saves and persists player skin choices across server restarts.
# ==============================================================================
skin-restorer:
  # Enable automatic skin restoration for players joining the server
  # Resolves player skins from Mojang session servers on cracked / offline networks
  auto-restore-on-join: true

  # Automatically detect and sign custom skins from cracked launchers (TLauncher, Ely.by)
  # When enabled, cracked players with skins on TLauncher or Ely.by have their skins automatically
  # signed and shown to ALL players on the server, including vanilla/Lunar/Badlion users.
  cracked-launcher-detection: true

  # Remember and persist custom /skin selections across server restarts
  persist-skins: true

  # Cooldown in seconds between skin changes for non-admin players (0 to disable)
  cooldown-seconds: 5

  # Default skin applied if an offline/cracked player has no premium Mojang account
  # Options: 'DEFAULT' (vanilla Steve/Alex), or any player name (e.g. 'Steve', 'ClownPierce')
  default-fallback-skin: 'DEFAULT'

  # Enable SkinsRestorer /sr command compatibility
  enable-sr-aliases: true

# ==============================================================================
# Update Checker & Notification System
# Notifies server administrators of new releases, patches, and security updates.
# Checks GitHub/Modrinth release APIs asynchronously without delaying server boot.
# ==============================================================================
update-checker:
  # Enable automatic background update checks
  enabled: true

  # Notify operators and admins with 'disguisecore.admin' permission on join when an update is available
  notify-admins-on-join: true

  # Check frequency in hours (default: 6 hours)
  check-interval-hours: 6

# Disallowed / Blacklisted Nicknames
blacklist:
  - 'admin'
  - 'administrator'
  - 'owner'
  - 'moderator'
  - 'mod'
  - 'helper'
  - 'staff'
  - 'console'
  - 'server'

